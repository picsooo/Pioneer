<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Pioneer School</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="../protect.js"></script><style>:root{--g:#1f5a46;--g2:#163f32;--c:#f4efe6;--t:#b5562f;--ink:#1d2a24;--mut:#6b7871;--ln:#e1d9c9;--y:#c99a1c}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Manrope,sans-serif;background:var(--c);color:var(--ink);display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{background:var(--g2);color:#cfe0d8;padding:26px 18px;display:flex;flex-direction:column;gap:6px}.lg{font-family:Fraunces,serif;font-size:20px;color:var(--c);display:flex;gap:10px;align-items:center;margin-bottom:26px}.lg b{width:34px;height:34px;border-radius:9px;background:var(--c);color:var(--g2);display:grid;place-items:center}aside a{padding:11px 14px;border-radius:10px;font-size:14px;font-weight:600;color:inherit;text-decoration:none;opacity:.75}aside a.on{background:rgba(244,239,230,.12);opacity:1;color:var(--c)}aside .ft{margin-top:auto;font-size:12px;opacity:.6}main{padding:30px 34px;overflow:hidden}.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:24px}h1{font-family:Fraunces,serif;font-weight:400;font-size:34px}.hd p{color:var(--mut);font-size:14px}.ctl{display:flex;gap:10px;flex-wrap:wrap}input,select{padding:11px 14px;border-radius:10px;border:1px solid var(--ln);background:#fff;font:inherit;font-size:14px}.btn{padding:11px 18px;border-radius:10px;border:0;font:inherit;font-weight:700;font-size:14px;cursor:pointer}.bp{background:var(--g);color:var(--c)}.bo{background:#fff;border:1px solid var(--ln);color:var(--ink)}.kpis{display:grid;grid-template-columns ansform:translate(-50%,120px);background:var(--ink);color:var(--c);padding:14px 22px;border-radius:12px;font-size:14px;transition:.4s;z-index:50}.toast.on{transform:translate(-50%,0)}.demo{background:#fbf3df;border:1px solid #ecd9a6;color:#7a5d0c;font-size:13px;padding:10px 14px;border-radius:10px;margin-bottom:18px}@media(max-width:1000px){body{grid-template-columns:1fr}aside{flex-direction:row;overflow:auto;padding:14px;align-items:center}.lg{margin:0 14px 0 0}aside .ft{display:none}.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}main{padding:22px 16px}}@media(max-width:560px){td.rt{display:none}.seg button{padding:7px 9px}}</style></head><body><aside><div class="lg"><b>P</b>Pioneer School</div><a class="on" href="#">Présences</a><a href="#">Élèves</a><a href="#">Groupes</a><a href="#">Formateurs</a><a href="#">Rapports</a> <a href="../index.html">← Retour au site</a><div class="ft">Espace administration</div></aside><main><div class="demo">Démonstration : les données affichées sont fictives.</div><div class="hd"><div><h1>Feuille de présence</h1><p id="sub"></p></div><div class="ctl"><select id="grp"></select> <input type="date" id="dt"> <button class="btn bp" id="save">Enregistrer l'appel</button></div></div><div class="kpis"><div class="k"><small>Élèves du groupe</small><strong id="kT">0</strong></div><div class="k"><small>Présents</small><strong id="kP">0</strong></div><div class="k"><small>Absents</small><strong id="kA">0</strong></div><div class="k"><small>En retard</small><strong id="kR">0</strong></div></div><div class="grid"><div class="card"><h2>Appel de la séance <span style="display:flex;gap:8px"><button class="btn bo" id="all">Tous présents</button><button class="btn bo" id="csv">Exporter</button></span></h2><table id="tb"></table></div><div style="display:grid;gap:18px;align-content:start"><div class="card"><h2>Taux de présence <span id="rate" style="font-family:Fraunces,serif;color:var(--g)"></span></h2><div class="bars" id="bars"
